# Render Blueprint: 저장소를 연결하면 이 설정대로 배포됩니다.
services:
  - type: web
    name: party-chat
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ACCESS_PASSWORD
        sync: false
